<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入・服事提醒機器人</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
  <script>
    try {
      const saved = localStorage.getItem("bot.theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (_) { document.documentElement.dataset.theme = "light"; }
  </script>
</head>
<body class="login-body">
<main class="login">
  <div class="eyebrow">⛪ 服事提醒機器人</div>
  <h1>請先登入</h1>
  <p class="muted">這個管理網頁設了密碼。忘記的話請問設定它的人。</p>
  {% if error %}<div class="banner error"><b>✕</b><span>{{ error }}</span></div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <div class="ffield">
      <label for="password">密碼</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" class="btn btn-primary">登入</button>
  </form>
</main>
</body>
</html>
